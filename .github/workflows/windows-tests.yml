name: Windows regression tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ahk:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        architecture: ['32', '64']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate scripts and run regression tests
        shell: pwsh
        run: ./tests/run-windows.ps1 -Architecture '${{ matrix.architecture }}'
